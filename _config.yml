title: EQ Nag
description: An EverQuest notification agent.
baseurl: "/eq-nag"

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-include-cache

color_scheme: nag-dark

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Download":
    - "https://github.com/guildantix/eq-nag/releases/latest"
  "Discord":
    - "https://discord.gg/e3Z8PR8EXE"
  "GitHub":
    - "https://github.com/guildantix/eq-nag"
aux_links_new_tab: true

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/guildantix/eq-nag"
gh_edit_branch: "master"
gh_edit_source: docs
gh_edit_view_mode: "edit"

defaults:
  - scope:
      path: ""
    values:
      layout: doc
      applies_to: "0.2.27"
      last_verified: 2026-11-01

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
