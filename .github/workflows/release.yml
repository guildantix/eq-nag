name: Release

# Releases the latest pre-release to everyone: Actions -> Release -> Run workflow.
#
# Rebuilds the code of the latest published pre-release under the next version
# number, so what ships is exactly what pre-release users ran.  The draft is
# filled with the notes of every pre-release since the last full release.
# Review it, then click Publish release (it's already labeled Latest); every
# copy of Nag then updates to it.
#
# Only people with write access to the repo can run this workflow.

on:
  workflow_dispatch:

permissions:
  contents: write   # lets the built-in GITHUB_TOKEN create the release & upload assets
  id-token: write   # build attestations
  attestations: write

# One release workflow at a time, so two runs can't pick the same version.
concurrency:
  group: nag-release

jobs:
  build:
    runs-on: windows-2022   # windows-latest has Visual Studio 2026, which node-gyp cannot use yet

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, to find the pre-release

      # The helper script and build action come from this branch; the app code
      # comes from the pre-release.
      - name: Choose the version and the pre-release to rebuild
        shell: bash
        run: |
          cp -r .github "$RUNNER_TEMP/nag-github"
          echo "VERSION=$(python .github/scripts/nag-release.py version release | tr -d '\r')" >> "$GITHUB_ENV"
          read -r source_tag source_sha <<< "$(python .github/scripts/nag-release.py release-source | tr -d '\r')"
          echo "SOURCE_TAG=$source_tag" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Releasing the code of $source_tag ($source_sha)"

      - name: Switch to the pre-release's code
        shell: bash
        run: |
          git checkout --force "$SOURCE_SHA"
          rm -rf .github && cp -r "$RUNNER_TEMP/nag-github" .github

      - name: Build
        uses: ./.github/actions/build-nag
        with:
          version: ${{ env.VERSION }}

      # A GitHub-signed record that these files were built by this workflow
      # from this commit (see "Is this download safe?" in the README).
      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            electron/output/EQ-Nag-Setup-${{ env.VERSION }}.exe
            electron/output/eq_nag_portable.exe

      - name: Create or update the draft release
        shell: bash
        run: |
          python .github/scripts/nag-release.py draft release "$VERSION" "$SOURCE_SHA" \
            "electron/output/EQ-Nag-Setup-$VERSION.exe" \
            "electron/output/EQ-Nag-Setup-$VERSION.exe.blockmap" \
            electron/output/eq_nag_portable.exe \
            electron/output/latest.yml
