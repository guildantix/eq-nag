name: Test build

# Builds a testers-only release: Actions -> Test build -> Run workflow, pick the
# branch and enter a pre-release version such as 0.2.27-beta.1.
#
# The release (tag test-<version>) is published but is neither a pre-release nor
# the latest release, and it has no latest.yml, so no copy of Nag updates to it.
# Hand the download link to testers.
#
# After testing, release as usual: push a v<version> tag (release.yml), publish
# it as a pre-release, then bump the version for the full (Latest) release.
#
# Only people with write access to the repo can run this workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version, e.g. 0.2.27-beta.1'
        required: true

permissions:
  contents: write   # lets the built-in GITHUB_TOKEN create the release & upload assets

jobs:
  build:
    runs-on: windows-2022   # windows-latest has Visual Studio 2026, which node-gyp cannot use yet

    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # A pre-release version sorts below the real release, so testers are
      # updated to it automatically once it ships.
      - name: Check the version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Use a pre-release version such as 0.2.27-beta.1 (got '$VERSION')."
            exit 1
          fi
          if gh release view "test-$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release test-$VERSION already exists. Use the next number."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # extraResources references .env, which is intentionally untracked/empty.
      - name: Ensure .env exists
        shell: bash
        run: touch .env

      # Only for this build; nothing is committed.
      - name: Set the test version
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version

      # Point the app at the production API (config.json.production -> config.json)
      - name: Set production config
        run: npm run set-production-env

      - name: Build Angular (production)
        run: npx ng build --configuration=production

      - name: Build installers
        run: npx electron-builder build --win --publish never

      - name: Create the testers-only release
        shell: bash
        run: |
          installer="electron/output/EQ-Nag-Setup-$VERSION.exe"
          portable="electron/output/eq_nag_portable.exe"
          cat > notes.md <<EOF
          Test build for testers only. Nag won't update to it automatically.

          The installer isn't code-signed, so Windows SmartScreen may warn the first
          time: click "More info", then "Run anyway". Once the real release is out,
          this build updates to it on its own.

          SHA-256:
          - \`EQ-Nag-Setup-$VERSION.exe\`: \`$(sha256sum "$installer" | cut -d' ' -f1)\`
          - \`eq_nag_portable.exe\`: \`$(sha256sum "$portable" | cut -d' ' -f1)\`

          Built from $GITHUB_REF_NAME at $GITHUB_SHA.
          EOF
          # GitHub can still mark the new release as latest despite
          # --latest=false (when the latest release was chosen automatically),
          # so remember the current latest release and set it back afterward.
          previous_latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)

          gh release create "test-$VERSION" "$installer" "$portable" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION test build (testers only)" \
            --notes-file notes.md \
            --latest=false

          if [ -n "$previous_latest" ] && [ "$previous_latest" != "test-$VERSION" ]; then
            gh release edit "$previous_latest" --repo "$GITHUB_REPOSITORY" --latest
          fi
          now_latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$now_latest" = "test-$VERSION" ]; then
            echo "::error::test-$VERSION is marked as the latest release. Edit the previous release and set its Release label to Latest."
            exit 1
          fi
          echo "Latest release is still $now_latest."
