name: Test build

# Builds a testers-only release: Actions -> Test build -> Run workflow.
#
# The version is chosen automatically: the next build number with a beta
# suffix, e.g. 0.2.27-beta.1, then 0.2.27-beta.2.  The release (tag
# test-<version>) is published but is neither a pre-release nor the latest
# release, and it has no latest.yml, so no copy of Nag updates to it.  Hand the
# download link to testers; once 0.2.27 is out, their build updates to it.
#
# It has two portables and no installer:
#   eq_nag_portable.exe       the same as a release build (no performance taps)
#   eq_nag_portable-perf.exe  the same code, always timing itself; it writes
#                             perf-report.json (tools/perf/README.md)
#
# Only people with write access to the repo can run this workflow.

on:
  workflow_dispatch:

permissions:
  contents: write   # lets the built-in GITHUB_TOKEN create the release & upload assets
  id-token: write   # build attestations
  attestations: write

# One release workflow at a time, so two runs can't pick the same version.
concurrency:
  group: nag-release

jobs:
  build:
    runs-on: windows-2022   # windows-latest has Visual Studio 2026, which node-gyp cannot use yet

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, to work out the version

      - name: Choose the version
        shell: bash
        run: echo "VERSION=$(python .github/scripts/nag-release.py version test | tr -d '\r')" >> "$GITHUB_ENV"

      # Exactly like a release build: the performance taps are removed.
      - name: Build the portable
        uses: ./.github/actions/build-nag
        with:
          version: ${{ env.VERSION }}
          perf-taps: 'false'
          win-targets: portable

      # Outside the project folder: packaging includes every file in it.
      - name: Keep the portable
        shell: bash
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/test-release"
          mkdir -p "$out"
          mv electron/output/eq_nag_portable.exe "$out/eq_nag_portable.exe"

      # The same build again with the performance taps, switched on by default.
      - name: Build the perf portable
        shell: bash
        run: |
          git checkout -- src/electron/utilities/perf-taps.js
          echo '{}' > src/electron/utilities/perf-always-on.json
          rm -rf electron/output
          npx electron-builder build --win portable --publish never
          if ! npx asar list electron/output/win-unpacked/resources/app.asar | grep -q 'perf-always-on'; then
            echo "::error::The perf portable doesn't contain the performance taps."
            exit 1
          fi
          if npx asar list electron/output/win-unpacked/resources/app.asar | grep -qi 'eq_nag_portable'; then
            echo "::error::The perf portable contains another portable; keep build outputs outside the project folder."
            exit 1
          fi
          mv electron/output/eq_nag_portable.exe "$(cygpath -u "$RUNNER_TEMP")/test-release/eq_nag_portable-perf.exe"

      # A GitHub-signed record that these files were built by this workflow
      # from this commit (see "Is this download safe?" in the README).
      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/test-release/eq_nag_portable.exe
            ${{ runner.temp }}/test-release/eq_nag_portable-perf.exe

      - name: Create the testers-only release
        shell: bash
        run: |
          portable="$(cygpath -u "$RUNNER_TEMP")/test-release/eq_nag_portable.exe"
          perf="$(cygpath -u "$RUNNER_TEMP")/test-release/eq_nag_portable-perf.exe"
          cat > notes.md <<EOF
          Test build for testers only. Nag won't update to it automatically.

          - **eq_nag_portable.exe**: the build to test.
          - **eq_nag_portable-perf.exe**: the same build, timing itself while it runs.
            Use it when Nag seems slow: run it the same way, then send
            \`perf-report.json\` from \`%APPDATA%\\electron-angular-eq-parse\`. It
            contains timings and trigger names, nothing else.

          These aren't code-signed, so Windows SmartScreen may warn the first time:
          click "More info", then "Run anyway".

          SHA-256:
          - \`eq_nag_portable.exe\`: \`$(sha256sum "$portable" | cut -d' ' -f1)\`
          - \`eq_nag_portable-perf.exe\`: \`$(sha256sum "$perf" | cut -d' ' -f1)\`

          Built from $GITHUB_REF_NAME at $GITHUB_SHA.
          EOF
          # GitHub can still mark the new release as latest despite
          # --latest=false (when the latest release was chosen automatically),
          # so remember the current latest release and set it back afterward.
          previous_latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)

          gh release create "test-$VERSION" "$portable" "$perf" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION test build (testers only)" \
            --notes-file notes.md \
            --latest=false

          if [ -n "$previous_latest" ] && [ "$previous_latest" != "test-$VERSION" ]; then
            gh release edit "$previous_latest" --repo "$GITHUB_REPOSITORY" --latest
          fi
          now_latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ "$now_latest" = "test-$VERSION" ]; then
            echo "::error::test-$VERSION is marked as the latest release. Edit the previous release and set its Release label to Latest."
            exit 1
          fi
          echo "Test build $VERSION is ready: https://github.com/$GITHUB_REPOSITORY/releases/tag/test-$VERSION"
