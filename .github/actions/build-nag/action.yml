name: Build Nag
description: Builds the Windows installer and portable exe for the given version (set for this build only; nothing is committed).

inputs:
  version:
    description: The version to build, e.g. 0.2.27 or 0.2.27-beta.1
    required: true
  perf-taps:
    description: "'true' keeps the performance taps (src/electron/utilities/perf-taps.js). Only test builds keep them; Release and Pre-release builds never ship them."
    required: false
    default: 'false'
  win-targets:
    description: Windows targets to build, e.g. "nsis portable" (installer and portable) or "portable".
    required: false
    default: 'nsis portable'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 18
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # extraResources references .env, which is intentionally untracked/empty.
    - name: Ensure .env exists
      shell: bash
      run: touch .env

    - name: Set the version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: npm version "$VERSION" --no-git-tag-version --allow-same-version

    # Point the app at the production API (config.json.production -> config.json)
    - name: Set production config
      shell: bash
      run: npm run set-production-env

    - name: Build Angular (production)
      shell: bash
      run: npx ng build --configuration=production

    - name: Remove the performance taps
      if: inputs.perf-taps != 'true'
      shell: bash
      run: rm src/electron/utilities/perf-taps.js

    # The workflows create the GitHub release themselves.
    - name: Build installers
      shell: bash
      env:
        TARGETS: ${{ inputs.win-targets }}
      run: npx electron-builder build --win $TARGETS --publish never

    - name: Check the performance taps aren't in the app
      if: inputs.perf-taps != 'true'
      shell: bash
      run: |
        if npx asar list electron/output/win-unpacked/resources/app.asar | grep -iE 'perf-taps|perf-always-on'; then
          echo "::error::The performance taps are in the built app, but this build must not include them."
          exit 1
        fi
        echo "The performance taps aren't in the app."
