    <style>
        body {
            color: #ffffff;
        }

        body.show-border {
            border: 6px solid rgba(0,0,0,0.5);
            display:block;
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
        }

        body.highlight-border {
            border: 6px solid #00d4ff59;
            display:block;
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
        }

        body.highlight-border .overlay-name-watermark {
            display: block;
        }

        .drag {
            /* -webkit-user-select: none;
            -webkit-app-region: drag; */
            background-color: rgba(0,0,0,0.15);
            /* border: 6px solid black; */
        }

        .drag .overlay-name-watermark {
            display: block;
        }

        section.body {
            -webkit-user-select: none;
            -webkit-app-region: drag;
            /* position: relative;
            display: inline-block;
            width: 500px;
            height: 50px; */
            position: fixed;
            left: 6px;
            right: 6px;
            top: 6px;
            bottom: 6px;
        }

        .overlay-name-watermark {
            text-align: center;
            color: rgba(255,255,255,0.15);
            display: none;
            z-index: 0;
        }
        
        .content-area {
            z-index: 1;
            position: fixed;
            left: 6px;
            right: 6px;
            top: 6px;
            bottom: 6px;
            padding: 5px;
        }

        .content-area p {
            margin: 0;
            /* line-height: 0.9em; */
            /* font-family: Roboto, sans-serif;
            font-style: italic;
            font-weight: 300; */
            /* -webkit-text-stroke: 1px black; */
            /* -webkit-text-stroke: 2px black; */
        }

        .content-area .progress {
            height: auto;
            margin-top: -5px;
            margin-bottom: 10px;
            line-height: 0.9em;
            /* height: 24px; */
        }

        .fct-label {
            position: absolute;
        }

        .fct-critical-hit {
            font-weight: bold;
        }

        .animate-bottom {
            position: absolute;
            animation: animatebottom 7s linear;
            /* animation-name: animatebottom;
            animation-duration: 2s */
        }
        @keyframes animatebottom { 
            0% { top:100%; opacity:1 } 
            100% { top:-100px; opacity:1; }
        }

        .animate-fade-shrink {
            position: absolute;
            display: inline-block;
            text-align: center;
            animation: animate-fadeshrink 4s ease-out;
        }

        @keyframes animate-fadeshrink {
            0% { opacity: 0.5; transform: scale(1.5); }
            1% { opacity: 1; transform: scale(2.0); }
            50% { opacity: 1; transform: scale(2.0); }
            /* 75% { opacity: .85; transform: scale(1.25);} */
            100% { opacity: 0; transform: scale(.1);}
        }

        /* @keyframes animate-fadeshrink {
            0% { opacity: 0.5; font-size: 58px; }
            1% { opacity: 1; font-size: 64px; }
            12% { opacity: 1; font-size: 64px; }
            25% { opacity: .85; font-size: 64px;}
            100% { opacity: 0; font-size: 6px;}
        } */

        .animate-fade-out {
            position:relative;
            display: inline-block;
            animation: animate-fadeout 7s ease;
        }

        @keyframes animate-fadeout {
            0% { opacity: 1; }
            60% { opacity: 1; }
            100% { opacity: 0; }
        }

        .fct-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .fct-dmg-src {
            /* float: left; */
            /* clear: both; */
            font-size: 12px;
            /* font-weight: 300; */
            font-weight: normal;
            color: #005aff;
            -webkit-text-stroke: .1px black;
            -webkit-text-fill-color: #005aff;
        }

        .fct-text {
            -webkit-text-stroke: 1px black;
            text-shadow: 0px 0px 10px black;
        }

        .dot-text {
            position: absolute;
            z-index: 1;
            padding: 4px;
            line-height: 0.9em;
            /* font-size: 12px !important; */
            /* font-weight: 300; */
            /* font-weight: normal !important; */
            /* font-kerning: none; */
            /* font-weight: normal !important; */
            letter-spacing: 1px;
            /* color: #000000; */
            /* text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff; */
            color: white;
            font-weight: 400 !important;
            /* font-family: 'Roboto' !important; */
            /* font-weight: 300 !important; */
            /* color: #005aff; */
            text-shadow: -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000, 1px 1px 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            /* text-shadow: 0px 0px 10px #000000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; */
            /* -webkit-text-stroke: 1px white; */
            /* color: #0000007a; */
            /* margin: 6px; */
            text-overflow: ellipsis;
            white-space: nowrap;
            /* width: 200px; */
            overflow: hidden;
            width: 100%;
            padding-right: 30px;
        }

        .grouped-mobs {
            display: flex;
            flex-wrap: wrap;
            /* align-items: flex-start; */
            align-content: flex-start;
            /* vertical-align: top; */
        }

        .mob-dot-group {
            display: inline-block;
            width: 200px;
            /* max-width: 63%; */
        }

        .mob-dot-group:nth-child(n+0) {
            margin-left: 25px;;
        }

            .mob-dot-group > div {
                width: 200px;
            }

                .mob-dot-group > div > p {
                    text-overflow: ellipsis;
                    white-space: nowrap;
                    width: 200px;
                    overflow: hidden;
                }

            .mob-dot-group h6 {
                text-align: center;
            }
            
            .mob-dot-group .dot-icons-grid {
                display: flex;
                /* justify-content: space-evenly; */
                flex-wrap: wrap;
            }

            .mob-dot-icon {
                display: inline-block;
                /* flex: 1; */
                margin: 4px;
                width: 50px;
            }

                .mob-dot-icon span {
                    display: block;
                }
    </style>

    <template id="displayTextTemplate">
        <p>{{value}}</p>
    </template>
    <template id="fctTemplate">
        <span class="fct-text">{{value}}</span>
        <span class="fct-dmg-src">({{damageSource}})</span>
    </template>
    <template id="fctCriticalTemplate">
        <p class="fct-text">{{value}}</p>
        <p class="fct-dmg-src">({{damageSource}})</p>
    </template>
    <template id="dotTimerTemplate">
        <p class="dot-text"><span class="time-remaining"></span>{{value}}</p>
        <!-- Background color of .progress is 13% of the .determinate color. -->
        <div class="progress" style="background-color: rgba(0,33,0,.75)"><p style="margin: 4px;">&nbsp;</p>
            <div class="determinate" style="width: 0%; background-color: #008000;"></div>
        </div>
    </template>
    <template id="dotTimerIconTemplate">
        <!-- A convergeance of dumb has resulted in the derp -->
        <img src="{{icon}}" class="dot-icon" derp="{{{iconStyle}}}" />
    </template>
    <template id="targetGroupTemplate">
        <!-- <div class="mob-dot-group"> -->
            <h6>{{name}}</h6>
        <!-- </div> -->
    </template>
    <template id="targetGroupTimerTemplate">
        <p class="dot-text"><span class="time-remaining"></span>{{value}}</p>
        <!-- Background color of .progress is 13% of the .determinate color. -->
        <div class="progress" style="background-color: rgba(0,33,0,.75)"><p style="margin: 4px;">&nbsp;</p>
            <div class="determinate" style="width: 40%; background-color: #008000;"></div>
        </div>
    </template>
