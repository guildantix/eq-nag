    <style>
        body {
            color: #ffffff;
            -webkit-user-select: none;
            user-select: none;
        }
        body::-webkit-scrollbar { 
            display: none;
        }

        div.highlight-border {
            border: 6px solid #00d4ff59;
        }

        div.highlight-border .overlay-name-watermark {
            display: block;
            color: #00d5ffcc;
        }

        .drag {
            resize: both;
        }

        .overlay-container.drag {
            background-color: rgba(0,0,0,0.15);
        }

        .resize-n {
            position: absolute;
            z-index: 111;
            right: -6px;
            left: -6px;
            top: -6px;
            height: 6px;
            cursor: ns-resize;
        }

        .resize-s {
            position: absolute;
            z-index: 111;
            right: -6px;
            left: -6px;
            bottom: -6px;
            height: 6px;
            cursor: ns-resize;
        }

        .resize-e {
            position: absolute;
            z-index: 111;
            right: -6px;
            top: -6px;
            width: 6px;
            bottom: -6px;
            cursor: ew-resize;
        }

        .resize-w {
            position: absolute;
            z-index: 111;
            left: -6px;
            top: -6px;
            width: 6px;
            bottom: -6px;
            cursor: ew-resize;
        }

        .overlay-container .resize-n,
        .overlay-container .resize-s,
        .overlay-container .resize-e,
        .overlay-container .resize-w {
            background-color: rgba(0,0,0,0.5);
        }

        .resize-ne {
            right: -6px;
            top: -6px;
            height: 12px;
            width: 12px;
            position: absolute;
            z-index: 111;
            cursor: ne-resize;
        }

        .resize-se {
            right: -6px;
            bottom: -6px;
            height: 12px;
            width: 12px;
            position: absolute;
            z-index: 111;
            cursor: se-resize;
        }

        .resize-sw {
            left: -6px;
            bottom: -6px;
            height: 12px;
            width: 12px;
            position: absolute;
            z-index: 111;
            cursor: sw-resize;
        }

        .resize-nw {
            left: -6px;
            top: -6px;
            height: 12px;
            width: 12px;
            position: absolute;
            z-index: 111;
            cursor: nw-resize;
        }

        .drag .overlay-name-watermark {
            display: block;
        }

        section.body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-app-region: drag;
            position: absolute;
            border: 1px solid orange;
            left: 6px;
            right: 6px;
            top: 6px;
            bottom: 6px;
        }

        .overlay-name-watermark {
            text-align: center;
            color: rgba(255,255,255,0.66);
            display: none;
            z-index: 0;
        }

        .overlay-name-watermark h1 {
            white-space: nowrap;
            font-size: 4.2rem;
            line-height: 110%;
            margin: 2.8rem 0 1.68rem 0;
            display: inline-block;

        }
        
        .overlay-content-area,
        .healing-content-area {
            position: absolute;
            left: 6px;
            right: 6px;
            top: 6px;
            bottom: 6px;
            padding: 5px;
        }
        
        .overlay-content-area.no-overflow,
        .healing-content-area.no-overflow {
            overflow: hidden;
            white-space: nowrap;
        }

        .overlay-content-area p {
            width: 100%;
        }

        .overlay-content-area.white-space-nowrap p {
            white-space: nowrap;
        }

        .overlay-content-area.white-space-normal p {
            white-space: normal;
        }

        .overlay-content-area.overflow-hidden p {
            overflow: hidden;
        }

        .overlay-content-area.overflow-hidden > div:not(.mob-dot-group) {
            width: 100%;
        }

        .overlay-content-area.overflow-visible p {
            overflow: visible;
        }

        .overlay-content-area.text-overflow-clip p {
            text-overflow: clip;
        }

        .overlay-content-area.text-overflow-ellipsis p {
            text-overflow: ellipsis;
        }

        .overlay-content-area.align-left {
            align-items: flex-start;
        }

        .overlay-content-area.align-center {
            align-items: center;
        }

            .overlay-content-area.align-center p {
                text-align: center;
            }

        .overlay-content-area.align-right {
            align-items: flex-end;
        }

            .overlay-content-area.align-right p {
                text-align: right;
            }

        .overlay-content-area p,
        .healing-content-area p {
            margin: 0;
        }

        .overlay-content-area .progress,
        .healing-content-area .progress {

            height: 1.5em;
            margin-bottom: 0.4em;
        }

        .overlay-content-area.timer {
            overflow: visible;
        }

        .overlay-content-area.timer.ungrouped {
            display: flex;
            flex-flow: column nowrap;
        }

        .overlay-content-area.timer.reverse {
            flex-flow: column-reverse nowrap;
        }

        .fct-label {
            position: absolute;
        }

        .fct-critical-hit {
            font-weight: bold;
        }

        .animate-bottom {
            position: absolute;
            animation: animatebottom 7s linear;
        }
        @keyframes animatebottom { 
            0% { top:100%; opacity:1 } 
            100% { top:-100px; opacity:1; }
        }

        .animate-fade-shrink {
            position: absolute;
            display: inline-block;
            text-align: center;
            /* animation: animate-fadeshrink 4s ease-out; */
        }

        @keyframes animate-fadeshrink {
            0% { opacity: 0.5; transform: scale(1.5); }
            1% { opacity: 1; transform: scale(2.0); }
            50% { opacity: 1; transform: scale(2.0); }
            100% { opacity: 0; transform: scale(.1);}
        }

        .animate-fade-out {
            position:relative;
            display: inline-block;
        }

        .animate-fade-out-now {
            animation: animate-fadout-now 0.5s ease;
        }

        @keyframes animate-fadout-now {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .animate-fadeinout-inf {
            animation: animate-fadeinout 2s ease-in-out infinite;
        }

        .animate-glow-fadein {
            animation: animate-fadeinout-in 1s ease-in;
        }

        .animate-glow-fadeout {
            animation: animate-fadeinout-out 1s ease-out;
        }

        @keyframes animate-fadeinout-out {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes animate-fadeinout-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes animate-fadeinout {
            0% { opacity: 0; }
            /* 25% { opacity: 0.75; } */
            50% { opacity: 1; }
            /* 75% { opacity: 0.75; } */
            100% { opacity: 0; }
        }

        .notice-me {
            transform-origin: center center;
            animation: notice-me 3.33s 1 ease-in-out;
            backface-visibility: hidden;
            -webkit-font-smoothing: subpixel-antialiased;
            transform: translateZ(0);
        }

        @keyframes notice-me {
            0% { transform: scale(1.0); }
            11.9% { transform: scale(1.25); }
            28.6% { transform: scale(0.9); }

            /* 33.4% { transform: scale(1.0); } */
            45.3% { transform: scale(1.25); }
            62% { transform: scale(0.9); }

            /* 66.8% { transform: scale(1.0); } */
            78.7% { transform: scale(1.25); }
            95.4% { transform: scale(0.9); }

            100% { transform: scale(1.0); }
        }

        .fct-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .fct-dmg-src {

            font-weight: normal;
            color: #005aff;

        }

        .fct-text {
            text-shadow:    0px 0px 1px #000000ff, -1px -1px 1px #000000ff, 1px -1px 1px #000000ff, -1px 1px 1px #000000ff, 1px 1px 1px #000000ff,

        }

        .fct-healing-out,

            align-self: flex-end;
        }

        .dot-text {
            position: absolute;
            z-index: 1;
            padding: 0.25em;
            line-height: 0.9em;
            letter-spacing: 1px;
            color: white;
            font-weight: 400 !important;
            text-shadow: -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000, 1px 1px 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .dot-text.ungrouped {
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            padding-right: 30px;
        }

        .grouped-mobs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(var(--item-min-width), 1fr));
            grid-auto-rows: min-content;
            grid-gap: 5px;
        }

        .grouped-mobs.reverse > .mob-dot-group {
            direction:ltr;
        }

        /* double rotate grid and item */
        .grouped-mobs.reverse, .grouped-mobs.reverse > .mob-dot-group {
            transform:rotate(180deg);
        }

        .mob-dot-group {
            display: flex;
            flex-flow: column nowrap;
        }
        
        .mob-dot-group:nth-child(n+0) {
            margin-left: 25px;
        }

            .mob-dot-group > div {
                min-width: var(--item-min-width);
            }

                .mob-dot-group > div > p {
                    text-overflow: ellipsis;
                    white-space: nowrap;
                    width: 100%;
                    overflow: hidden;
                }

            .mob-dot-group h6 {
                text-align: center;
            }
            
            .mob-dot-group .dot-icons-grid {
                display: flex;
                flex-wrap: wrap;
            }

            .mob-dot-icon {
                display: inline-block;
                margin: 4px;
                width: 50px;
            }

                .mob-dot-icon span {
                    display: block;
                }
    </style>

    <style>

        :root {
            --ease-out-cubic: cubic-bezier(0.33, 1, 0.68, 1);
            --ease-in-cubic: cubic-bezier(0.32, 0, 0.67, 0);
        }

        @keyframes animate-fadein {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes animate-fadeout {
            77% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes animate-floatup {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-100px); }
        }

        @keyframes animate-blowout {
            0% { transform: scale(1.5); }
            1% { transform: scale(2.0); }
            50% { transform: scale(2.0); }
            100% { transform: scale(.1); }
        }

        @keyframes animate-grow {
            0% { transform: scale(.1); }
            100% { transform: scale(1); }
        }

        @keyframes animate-shrink {
            0% { transform: scale(1.0); }
            100% { transform: scale(.1); }
        }

        @keyframes animate-blowout-fadeout {
            0% { transform: scale(1.5); }
            1% { transform: scale(2.0); }
            50% { transform: scale(2.0); opacity: 1; }
            100% { transform: scale(.1); opacity: 0; }
        }

        /* // Primary animation */
        /* // var(--random-y) & var(--y-direction), to be applied to the element via script */
        @keyframes animate-fountain-floatup {
            0% { transform: translateY(0px); animation-timing-function: var(--ease-out-cubic); }
            77% { transform: translateY(var(--random-y)); animation-timing-function: ease-in; }
            100% { transform: translateY(calc(var(--random-y) + var(--y-direction))); animation-timing-function: ease-out; }
        }

        /* // Secondary animation */
        /* // var(--random-x), to be applied to the element via script */
        @keyframes animate-fountain-horizontal {
            0% { transform: translateX(0px); animation-timing-function: ease-in; }
            100% { transform: translateX(var(--random-x)); animation-timing-function: ease-in; }
        }

    </style>
</head>

    <script type="text/javascript">
        const urlParams = new URLSearchParams( window.location.search );
        var Renderer = window.api.getRenderer();
        var data = Renderer( +urlParams.get( 'originX' ), +urlParams.get( 'originY' ), urlParams.get('glowOnStart') === 'true' );

        var recordEncounters = false;
        function toggleRecordEncounters() {
            recordEncounters = !recordEncounters;
            window.api.recordEncounters(recordEncounters);

            if (recordEncounters) {
                document.getElementById('encounterRecordBtn').classList.add('record-enabled');
            } else {
                document.getElementById('encounterRecordBtn').classList.remove('record-enabled');
            }
        }
    </script>

     <template id="listTemplate">
        <div class="list-container {{this.listCssClass}}">
            <div class="list-header">
                <span class="list-title">{{this.listTitle}}</span>
            </div>
            <div class="list-content">
                <div class="list-items">
                    {{#each items}}
                        <div class="list-item" data-name="{{this.name}}">
                            <div class="list-item-content">
                                <span class="list-item-icon {{this.textCssClass}}"><i class="fas {{this.iconCssClass}}"></i></span>
                                <span class="list-item-title {{this.textCssClass}}">{{this.name}}</span>

                                <div class="list-progress"><p style="margin: 4px;">&nbsp;</p>
                                    <div class="list-determinate top" style="width: 0%; background-color: #921f1f; z-index: unset;"></div>
                                    <div class="list-determinate bottom" style="width: 0%; background-color: #0e905e; z-index: unset;"></div>
                                </div>
                            </div>
                        </div>
                    {{/each}}
                </div>
            </div>
        </div>
    </template>

            left: -1px;
        }
        .window.dps-meter .window-footer .window-footer-text {
            padding: .5em .75em;
            color: #c1c1c1;
            font-size: .75em;
            display: flex;
            flex-flow: row nowrap;
            width: 100%;
        }
        .window.dps-meter .window-footer .window-footer-text .encounter-name {
            overflow: hidden;
            flex: 1 1 auto;
            max-height: 6em;
            text-overflow: ellipsis;
        }
        .window.dps-meter .window-footer .window-footer-text .encounter-time {
            flex: 0 0 auto;
        }
        .window.dps-meter .window-footer .window-footer-text .encounter-time.strong {
            font-weight: bold;
            color: #cfcfcf;
        }
        .window.dps-meter .window-title .spacer {
            flex: 1 1 auto;
        }
        .window.dps-meter .window-title .window-title-col.text {
            padding-left: 1em;
        }
        .window.dps-meter .window-title .window-title-col.title-btn {
            width: 1em;
            height: 1em;
            cursor: pointer;
            margin: 0 0.5em 0 0;
            position: relative;
        }
        .window.dps-meter .window-title .window-title-col.title-btn:not(.record-button):hover {
            color: #b8b8b8;
        }
        .window.dps-meter .window-title .window-title-col.title-btn:active {
            color: #929292;
        }
        .window.dps-meter .window-title .window-title-col.title-btn.record-button:active {
            color: #920000;
        }
        .tooltip {
            display: none;
            position: fixed;
            white-space: nowrap;
            padding: 2px 15px;
            background-color: #000000a6;
            color: #dfdfdf;
            border: 2px solid black;
        }
        .window.dps-meter .window-title .window-title-col.title-btn:hover .tooltip {
            display: block;
            transform: translate(-50%, -210%);
        }
        .window-content {
            border-right: 4px solid #181818;
            margin: 0;
            border-left: 4px solid #181818;
            height: calc(100% - 34px);
            overflow: hidden;
            overflow-y: scroll;
            background-color: #00000070;
        }
        .window-content .dps-item {
            position: relative;
            height: 1.75em;
            background-color: #181818;
            white-space: nowrap;
            text-overflow: clip;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        .window-content .dps-item .dps-item-name {
            /* position: absolute; */
            z-index: 1;
            padding: 0.25em;
            line-height: 1.15em;
            letter-spacing: 1px;
            color: white;
            font-weight: 400 !important;
            text-shadow: -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000, 1px 1px 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            padding-left: 1em;
        }
        .window-content .dps-item .dps-item-icon {
            height: 1.75em;
        }
        .window-content .dps-item .dps-item-icon-placeholder {
            height: 1.75em;
            width: 1.75em;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 0.1em solid #e7d36b;
            background-color: #292429;
            padding-left: 0.45em;
        }
        .window-content .dps-item .progress {
            height: 100%;
            border-radius: 0;
            margin: 0;
        }
        /* .window.dps-meter .window-content .dps-item .progress .determinate .border {
            background: linear-gradient(to right, attr(data-left-color), attr(data-right-color));
        } */
        .window.dps-meter .window-content .dps-item .progress .determinate .border.top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
        }
        .window.dps-meter .window-content .dps-item .progress .determinate .border.bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
        }
        .dps-item-label {
            position: absolute;
            display: flex;
            flex-flow: row nowrap;
            left: 0;
            right: 0;
            z-index: 1;
            align-items: center;
        }
        .dps-item-label .spacer {
            flex: 1 1 auto;
        }
        .dps-item-values {
            text-shadow: -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000, 1px 1px 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .dps-item.mine {
            box-shadow: inset 0 0 5px #fbff00;
            border: 1px solid #fbff00;
            border-radius: 2px;
        }
        .dps-line-item {
            text-shadow: -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000, 1px 1px 2px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .window.dps-meter .damage {
            width: 75px;
        }
        .window.dps-meter .sec,
        .window.dps-meter .dps {
            width: 50px;
        }
        .window.dps-meter .damage,
        .window.dps-meter .dps,
        .window.dps-meter .sec {
            text-align: right;
        }
        .window.dps-meter .right-pad {
            width: 1em;
            display: inline-block;
            background-color: unset;
        }
        .dps-line-item.damage,
        .dps-line-item.dps,
        .dps-line-item.sec {
            padding-right: 0.25em;
        }
        .window-title-col.damage,
        .window-title-col.dps,
        .window-title-col.sec {
            padding-right: 0.25em;
        }
        .window.dps-meter .damage,
        .window.dps-meter .dps,
        .window.dps-meter .sec {
            display: none;
        }
        .window.dps-meter.damage .damage,
        .window.dps-meter.dps .dps,
        .window.dps-meter.sec .sec {
            display: inline;
            background-color: unset;
        }
        .window-title .hide {
            display: none;
        }
        .window-title:hover .window-title-col.mouse-hide {
            display: none;
        }
        .window-title .window-title-col.mouse-show {
            display: none;
        }
        .window-title:hover .window-title-col.mouse-show {
            display: inline !important;
        }

        .window-settings {
            position: absolute;
            z-index: 11111;
            left:0;
            right:0;
        }
        .window-settings-row {
            display: flex;
            flex-flow: row nowrap;
            align-items: center;
            justify-content: flex-start;
            padding: 0.25em 0.5em;
            width: 100%;
        }
        .window-settings-row .spacer {
            flex: 1 1 auto;
        }
        .record-enabled {
            color: #ff0000;
        }

        .dropdown-menu {
            position: absolute;
            z-index: 10;
            background-color: #181818;
            border: 1px solid #222222;
        }
        .dropdown-menu .dropdown-menu-item {
            min-width: 200px;
            color: #adadad;
            cursor: pointer;
            padding: 0.25em 0.5em;
        }
        .dropdown-menu .dropdown-menu-item:hover {
            background-color: #222222;
        }
        .dropdown-menu .dropdown-menu-item span {
            padding-left: 0.5em;
        }
        .dropdown-menu .dropdown-menu-item i {
            min-width: 1.2em;
        }
        .dropdown-menu .dropdown-menu-content {
            max-height: 21em;
            overflow: hidden;
            scroll-behavior: auto;
            overflow-y: scroll;
        }
    </style>
    
    <!-- =============================== -->
    <!--          Dropdown Menu          -->
    <!-- =============================== -->

    <template id="dropdownMenu">
        <div class="dropdown-menu">
            <div class="dropdown-menu-content dynamic-mouse">
                {{#each menuItems}}
                    <div class="dropdown-menu-item menu-item" data-item-type="{{this.itemType}}" data-encounter-id="{{this.encounterId}}" data-mob-name="{{this.mobName}}">
                        <i class="fas {{this.cssClass}}"></i>
                        <span>{{this.label}}</span>
                    </div>
                {{/each}}
            </div>
        </div>
    </template>
    
    <!-- =========================== -->
    <!--          DPS Meter          -->
    <!-- =========================== -->
    <template id="dpsWindowTemplate">
        <div class="window dps-meter damage dps sec" style="display: none;">
            <div class="window-title dynamic-mouse" style="overflow: hidden;">
                <span class="window-title-col text" style="white-space: nowrap;">Damage Done</span>
                <span class="window-title-col spacer"></span>
                <span class="window-title-col damage mouse-hide">Damage</span>
                <span class="window-title-col dps mouse-hide">DPS</span>
                <span class="window-title-col sec mouse-hide">Time</span>
                <!-- <span class="window-title-col title-btn mouse-show"><i class="fa-solid fa-table-columns"></i></span> -->
                <!-- <span class="window-title-col title-btn mouse-show"><i class="fa-solid fa-magnifying-glass-chart"></i><span class="tooltip">Select Columns</span></span> -->
                <!-- <span class="window-title-col title-btn mouse-show" onclick="window.api.showSettings('combatDatabase')"><i class="fa-solid fa-user-check"></i><span class="tooltip">Edit Data</span></span> -->
                <span class="window-title-col title-btn mouse-show" onclick="window.api.showSettings('combatStatistics')"><i class="fas fa-gear"></i><span class="tooltip">Settings</span></span>
                <span class="window-title-col title-btn mouse-show clear-encounter"><i class="fa-solid fa-ban"></i><span class="tooltip">Clear History</span></span>
                <span class="window-title-col title-btn mouse-show record-button" id="encounterRecordBtn" onclick="toggleRecordEncounters()"><i class="fa-solid fa-circle"></i><span class="tooltip">Record</span></span>
                <span class="window-title-col title-btn mouse-show database-dropdown-menu"><i class="fa-solid fa-database"></i><span class="tooltip">Change View</span></span>
                <span class="window-title-col right-pad"></span>
            </div>
            <div class="window-content dps-items click-through">
                <!-- <div class="dps-item mine">
                    
                    <div class="dps-item-label">
                        <img class="dps-item-icon" style="display: none;" />
                        <span class="dps-item-icon-placeholder"><i class="fa-solid fa-question"></i></span>
                        <span class="dps-item-name">Ryvn</span>
                        <span class="spacer"></span>
                        <span class="dps-line-item damage">456k</span>
                        <span class="dps-line-item dps">26.3k</span>
                        <span class="dps-line-item sec">32s</span>
                        <span class="dps-line-item right-pad"></span>
                    </div>
                    <div class="progress" style="background-color: unset;"><p style="margin: 4px;">&nbsp;</p>
                        <div class="determinate" style="background-color: red; width: 100%;" >
                            <div class="border top" style="background-color: white;"></div>
                            <div class="border bottom" style="background-color: white;"></div>
                        </div>
                    </div>

                </div> -->
            </div>
            <div class="window-footer">
                <span class="window-footer-text">
                    <span class="encounter-name"></span>
                    <span class="encounter-time"></span>
                </span>
            </div>
        </div>
    </template>

    <!-- =========================== -->
    <!--      DPS Meter - Item       -->
    <!-- =========================== -->
    <template id="dpsWindowItemTemplate">
        <div class="dps-item-label">
            {{#if (if_neq iconImage '/assets/images/-icon.png')}}
                <img class="dps-item-icon" src="{{iconImage}}" />
            {{else}}
                <span class="dps-item-icon-placeholder"><i class="fa-solid fa-question"></i></span>
            {{/if}}
            <span class="dps-item-name">{{label}}</span>
            <span class="spacer"></span>
            <span class="dps-line-item damage">{{damage}}</span>
            <span class="dps-line-item dps">{{dps}}</span>
            <span class="dps-line-item sec">{{sec}}</span>
            <span class="dps-line-item right-pad"></span>
        </div>
        <div class="progress" style="background-color: unset"><p style="margin: 4px;">&nbsp;</p>
            <div class="determinate" >
                <div class="border top"></div>
                <div class="border bottom"></div>
            </div>
        </div>
    </template>
    
    <!-- =========================== -->
    <!--    FCT Overlay Template     -->
    <!-- =========================== -->
    <template id="overlayFct">
        <div class="overlay-name-watermark"><h1 id="overlay-title">Overlay Title</h1></div>
        <div class="content-area-v2">
            <div class="fct-content top-left"></div>
            <div class="fct-content top-right"></div>
            <div class="fct-content bottom-left"></div>
            <div class="fct-content bottom-right"></div>
            <div class="fct-content random"></div>
        </div>
        <div class="overlay-content-area">

        </div>
        <div class="healing-content-area">
            
        </div>
    </template>

    <!-- =========================== -->
    <!--      FCT 2 Template         -->
    <!-- =========================== -->
    <template id="fct2Template">
        <!-- <div class="fct-values fctGroupA"> -->
            <div class="fct-sub-animation">
                <div class="fct-text-layer">
                    <span class="fct-text fctText">{{value}}</span>
                    <span class="fct-dmg-src fctSource">({{damageSource}})</span>
                </div>
            </div>
        <!-- </div> -->
    </template>
    
    <!-- =========================== -->
    <!--    Display Text Template    -->
    <!-- =========================== -->
    <template id="displayTextTemplate">
        <p>{{{value}}}</p>
    </template>

    <!-- =========================== -->
    <!--         FCT Template        -->
    <!-- =========================== -->
    <template id="fctTemplate">
        <span class="fct-text">{{value}}</span>
        <span class="fct-skill">({{damageSource}})</span>
    </template>

    <!-- =========================== -->
    <!--    FCT Critical Template    -->
    <!-- =========================== -->
    <template id="fctCriticalTemplate">
        <p class="fct-text">{{value}}</p>
        <p class="fct-skill">({{damageSource}})</p>
    </template>

    <!-- =========================== -->
    <!--        Timer Template       -->
    <!-- =========================== -->
    <template id="timerTemplate">
        <p class="dot-text ungrouped"><span class="time-remaining"></span>{{{value}}}</p>
        <!-- Background color of .progress is 13% of the .determinate color. -->
        <div class="progress" style="background-color: rgba(0,33,0,.75)"><p style="margin: 4px;">&nbsp;</p>
            <div class="determinate" style="width: 0%; background-color: #008000;"></div>
        </div>
    </template>

    <!-- =========================== -->
    <!--     Timer Icon Template     -->
    <!-- =========================== -->
    <template id="timerIconTemplate">
        <!-- A convergeance of dumb has resulted in the derp -->
        <img src="{{icon}}" class="dot-icon" derp="{{{iconStyle}}}" />
    </template>

    <!-- =========================== -->
    <!--    Target Group Template    -->
    <!-- =========================== -->
    <template id="targetGroupTemplate">
        <h6>{{{name}}}</h6>
    </template>

    <!-- =========================== -->
    <!-- Target Group Timer Template -->
    <!-- =========================== -->
    <template id="targetGroupTimerTemplate">
        <p class="dot-text"><span class="time-remaining"></span>{{{value}}}</p>
        <!-- Background color of .progress is 13% of the .determinate color. -->
        <div class="progress" style="background-color: rgba(0,33,0,.75)"><p style="margin: 4px;">&nbsp;</p>
            <div class="determinate" style="width: 40%; background-color: #008000;"></div>
        </div>
    </template>

</body>
</html>
