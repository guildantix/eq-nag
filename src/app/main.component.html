<p style="margin: 0;">
    <mat-toolbar class="titlebar" color="primary">
        <span>NAG<span class="hover-only">: An EverQuest Notification Agent</span></span>
        <span class="spacer"></span>
        <button mat-icon-button aria-label="Minimize to tray" (click)="minimizeTaskbar()">
            <mat-icon>south_east</mat-icon>
        </button>
        <button mat-icon-button aria-label="Minimize application" (click)="minimizeTaskbar()">
            <mat-icon>minimize</mat-icon>
        </button>
        <button mat-icon-button aria-label="Exit application" (click)="quitApp()">
            <mat-icon>clear</mat-icon>
        </button>
    </mat-toolbar>
</p>
<section>
    <mat-tab-group animationDuration="0ms" (selectedIndexChange)="onChangeTabs($event)" [selectedIndex]="0">

        <mat-tab label="Characters">
            <mat-toolbar>
                <span>Characters</span>
                <span class="spacer"></span>
                <button mat-button color="accent" (click)="characterList.newCharacter()">New Character</button>
            </mat-toolbar>

            <div class="tab-content">
                <app-characters-list #characterList></app-characters-list>
            </div>

        </mat-tab>
        <mat-tab label="Triggers">
                
            <app-triggers></app-triggers>

        </mat-tab>
        <mat-tab label="Overlays">
                <mat-toolbar>
                    <span>Overlays</span>
                    <span class="spacer"></span>
                    <button mat-button color="accent" (click)="showNewOverlayDialog()">New Overlay</button>
                </mat-toolbar>
                <div class="tab-content">
                    <table mat-table #overlaysTable="matTable" style="width: 100%;"
                        [dataSource]="overlays">

                        <ng-container matColumnDef="edit">
                            <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 50px;">  </th>
                            <td mat-cell *matCellDef="let element; let i = index" style="text-align: center; width: 50px;">
                                <button mat-button color="accent" aria-label="Edit this overlay" (click)="enableOverlayEdit(element.overlayId)">Edit</button>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef style="width: 100px; padding-left: 15px;"> Id </th>
                            <td mat-cell *matCellDef="let element; let i = index" style="width: 100px; padding-left: 15px;"> {{element.overlayId}} </td>
                        </ng-container>

                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef style="padding-left: 15px;"> Name </th>
                            <td mat-cell *matCellDef="let element; let i = index" style="padding-left: 15px;"> {{element.name}} </td>
                        </ng-container>

                        <ng-container matColumnDef="delete">
                            <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 50px; padding-left: 15px;">  </th>
                            <td mat-cell *matCellDef="let element; let i = index" style="text-align: center; width: 50px; padding-left: 15px;">
                                <button mat-icon-button color="warn" aria-label="Delete this overlay" (click)="deleteOverlay(i)">
                                    <mat-icon>clear</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="['edit', 'id', 'name', 'delete']"></tr>
                        <tr mat-row *matRowDef="let element; columns: ['edit', 'id', 'name', 'delete'];"></tr>

                    </table>
                </div>

        </mat-tab>
        <mat-tab label="Floating Combat Text">
            <mat-toolbar>
                <span>Floating Combat Text</span>
                <span class="spacer"></span>
            </mat-toolbar>
            <div class="tab-content">

                <fieldset>
                    <legend><span class="title">General</span></legend>
                    <p>
                        <mat-checkbox [(ngModel)]="enableFct" (change)="onEnableFctChange()">Enable</mat-checkbox>
                    </p>
                    
                    <p>
                        <mat-form-field>
                            <mat-label></mat-label>
                            <mat-select [(ngModel)]="damageDealtOverlayId" name="ddlDamageDealtOverlay" (selectionChange)="onChangeDealtFctOverylays()">
                                <mat-option *ngFor="let option of fctOverlays" [value]="option.overlayId">{{option.name}}</mat-option>
                            </mat-select>
                            <mat-hint>Damage Dealt Overlay</mat-hint>
                        </mat-form-field>
                    </p>

                    <p>
                        <mat-form-field>
                            <mat-label></mat-label>
                            <mat-select [(ngModel)]="damageTakenOverlayId" name="ddlDamageReceivedOverlay" (selectionChange)="onChangeReceivedFctOverylays()">
                                <mat-option *ngFor="let option of fctOverlays" [value]="option.overlayId">{{option.name}}</mat-option>
                            </mat-select>
                            <mat-hint>Damage Received Overlay</mat-hint>
                        </mat-form-field>
                    </p>
                    
                </fieldset>

            </div>
        </mat-tab>
        <mat-tab label="Settings">

            <app-settings></app-settings>

        </mat-tab>
    </mat-tab-group>

    <input type="file" #fileSelector style="display:none;" accept="*.txt" (change)="fileSelected($event)" />

</section>
