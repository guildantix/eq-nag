<p style="margin: 0;">
    <mat-toolbar class="titlebar" color="primary">

        <span>NAG<span class="hover-only">: An EverQuest Notification Agent</span></span>

        <span class="spacer"></span>
        
        <div class="progress-bars">
            <div class="progress-bar" *ngIf="archivePercent !== null"><mat-progress-bar mode="determinate" [value]="archivePercent * 100" color="accent" class="color-green"></mat-progress-bar><div>{{archiveLabel}}</div></div>
            <div class="progress-bar" *ngIf="transmitPercent !== null"><mat-progress-bar mode="determinate" [value]="transmitPercent * 100" color="accent" class="color-green"></mat-progress-bar><div><mat-icon class="material-icons-outlined">wifi</mat-icon> {{transmitLabel}}</div></div>
        </div>

        <button mat-icon-button class="connected-button" aria-label="Run Setup Wizard" *ngIf="connected" (click)="disconnectChatRoom()" matTooltip="Turn off log sync" matTooltipPosition="below">
            <mat-icon class="material-icons-outlined no-hover" style="opacity: 0.95; ">public</mat-icon>
            <mat-icon class="material-icons-outlined hover" style="opacity: 0.95; ">public_off</mat-icon>
        </button>

        <button mat-icon-button aria-label="Run Setup Wizard" (click)="runSetupWizard()" *ngIf="!setupCompleted" matTooltip="Run setup wizard" matTooltipPosition="below">
            <mat-icon class="material-icons-outlined color-green" style="font-size: 32px; line-height: 32px; width: 32px; height: 32px;">settings_suggest</mat-icon>
        </button>

        <!-- <button mat-icon-button aria-label="Easy Mode" (click)="showEasyWindow()" class="hover-green"><mat-icon class="material-icons-outlined">auto_awesome</mat-icon></button> -->
        
        <button mat-icon-button aria-label="Minimize to tray" (click)="sendToTray()" matTooltip="Minimize to system tray" matTooltipPosition="below">
            <mat-icon>south_east</mat-icon>
        </button>
        
        <button mat-icon-button aria-label="Minimize application" (click)="minimizeTaskbar()" matTooltip="Minimize" matTooltipPosition="below">
            <mat-icon>minimize</mat-icon>
        </button>
        
        <button mat-icon-button aria-label="Exit application" (click)="quitApp()" matTooltip="Quit Nag" matTooltipPosition="below">
            <mat-icon>clear</mat-icon>
        </button>
    
    </mat-toolbar>
</p>
<section>
    <mat-tab-group animationDuration="0ms" (selectedIndexChange)="onChangeTabs($event)" [selectedIndex]="0">

        <mat-tab label="Characters">
            <mat-toolbar>
                <span>Characters</span>
                <span class="spacer"></span>
                <button mat-button color="accent" (click)="characterList.newCharacter()">New Character</button>
                <button mat-button (click)="testFn()" *ngIf="false">Test</button>
            </mat-toolbar>

            <div class="tab-content">
                <app-characters-list #characterList></app-characters-list>
            </div>

        </mat-tab>
        <mat-tab label="Triggers">
                
            <app-triggers #triggersList></app-triggers>
            
        </mat-tab>
        <mat-tab label="Overlays">
                
            <app-overlays [damageDealtOverlayId]="damageDealtOverlayId" [damageTakenOverlayId]="damageTakenOverlayId" [isDev]="isDev"></app-overlays>

        </mat-tab>
        <mat-tab label="Combat">
            <mat-tab-group class=".sub-tabs">
                <mat-tab label="Combat Statistics">
                    <app-combat-statistics></app-combat-statistics>
                </mat-tab>
                <mat-tab label="Floating Combat Text">
                    <app-floating-combat-text></app-floating-combat-text>
                </mat-tab>
            </mat-tab-group>
        </mat-tab>
        <mat-tab label="Settings">

            <app-settings [characterList]="characterList" #settingsPanel></app-settings>

        </mat-tab>
    </mat-tab-group>

    <input type="file" #fileSelector style="display:none;" accept="*.txt" (change)="fileSelected($event)" />

</section>

<app-debug-console></app-debug-console>
