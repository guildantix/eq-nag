<mat-tab-group animationDuration="0ms" [selectedIndex]="0">
    <mat-tab label="Notification text">
        
        <div class="card-tab-content">

            <mat-form-field>
                <mat-label>Overlay Window</mat-label>
                <mat-select [(ngModel)]="action.overlayId" name="ddlLogOverlay">
                    <mat-option *ngFor="let option of overlayOptions" [value]="option.overlayId">{{option.name}}</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Display Text</mat-label>
                <input matInput [(ngModel)]="action.displayText" name="txtDisplayText" />
            </mat-form-field>

            <mat-form-field>
                <mat-label>Display for seconds</mat-label>
                <input matInput [(ngModel)]="action.duration" name="txtDisplayText_Duration" type="number" />
            </mat-form-field>
            
        </div>
    </mat-tab>
</mat-tab-group>
