<h2 mat-dialog-title>Select a parent folder</h2>

<mat-dialog-content>
    
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">

        <!-- This is the tree node template for leaf nodes -->
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding matTreeNodePaddingIndent="20">
            <!-- <mat-icon [inline]="true" class="material-icons">{{node.selected === true ? 'folder_open' : 'folder'}}</mat-icon> -->
            <button mat-icon-button><mat-icon [inline]="true" class="material-icons">{{node.selected === true ? 'folder_open' : 'folder'}}</mat-icon></button>
            <span class="spacer">{{node.name}}</span>
        </mat-tree-node>

        <!-- This is the tree node template for expandable nodes -->
        <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding matTreeNodePaddingIndent="20">
            <!-- <mat-icon [inline]="true" class="mat-icon-rtl-mirror">{{treeControl.isExpanded(node) ? 'folder_open' : 'folder'}}</mat-icon> -->
            <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name"><mat-icon [inline]="true" class="mat-icon-rtl-mirror">{{treeControl.isExpanded(node) ? 'folder_open' : 'folder'}}</mat-icon></button>
            <span class="spacer">{{node.name}}</span>
        </mat-tree-node>

    </mat-tree>

</mat-dialog-content>

<mat-dialog-actions>
    
    <button mat-button mat-dialog-close class="t-confirm-no" color="warn">Cancel</button>

</mat-dialog-actions>
