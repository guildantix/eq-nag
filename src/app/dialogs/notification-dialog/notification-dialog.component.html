<h2 mat-dialog-title>{{(data.title == null ? 'Notification' : data.title)}}</h2>

<mat-dialog-content>

    <div style="display: flex;flex-direction: row;">
        <div style="display: flex;padding: 20px 25px;">
            <mat-icon class="material-icons-outlined" style="font-size: 48px;width: 48px;height: 48px;" *ngIf="data.notificationType == notificationTypes.Warning">warning</mat-icon>
            <mat-icon style="font-size: 48px;width: 48px;height: 48px;" *ngIf="data.notificationType == notificationTypes.Error">error</mat-icon>
            <mat-icon class="material-icons-outlined" style="font-size: 48px;width: 48px;height: 48px;" *ngIf="data.notificationType == notificationTypes.Information">info</mat-icon>
            <mat-icon class="material-icons-outlined" style="font-size: 48px;width: 48px;height: 48px;" *ngIf="data.notificationType == notificationTypes.Custom && data.icon != null">{{data.icon}}</mat-icon>
        </div>
        <div style="padding-top: 15px; padding-bottom: 15px; overflow-y: auto; max-height: 245px;">
            <p style="margin: 0px 0px 8px 0px;" *ngFor="let msg of messages" [innerHtml]="msg | coloredString"></p>
        </div>
    </div>

</mat-dialog-content>

<mat-dialog-actions>
    
    <button mat-button [mat-dialog-close]="model" class="t-confirm-no">Close</button>
    <ng-template ngFor let-item [ngForOf]="data.customButtons">
        <button *ngIf="!item.matIconButton" (click)="onClickCustomButton(item)" mat-button class="{{item.cssClassString}}"><mat-icon *ngIf="item.showIcon" [ngClass]="{'material-icons-outlined': item.matIconsOutlined}">{{item.matIcon}}</mat-icon> {{item.text}}</button>
        <button *ngIf="item.matIconButton" (click)="onClickCustomButton(item)" mat-icon-button class="{{item.cssClassString}}"><mat-icon [ngClass]="{'material-icons-outlined': item.matIconsOutlined}">{{item.matIcon}}</mat-icon></button>
    </ng-template>

</mat-dialog-actions>
