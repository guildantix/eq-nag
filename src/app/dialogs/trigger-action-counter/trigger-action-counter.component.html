

<mat-tab-group animationDuration="0ms" [selectedIndex]="0">
    <mat-tab label="Counter">
        
        <div class="card-tab-content">

            <div>Reset the counter after&nbsp;<app-duration [(ngModel)]="action.duration" name="durActionDuration" [inline]="true"></app-duration>.</div>

            <mat-form-field style="width: 100%;">
                <mat-label>Counter name</mat-label>
                <input matInput [(ngModel)]="action.displayText" name="txtCounterName" />
            </mat-form-field>

        </div>

    </mat-tab>
    <mat-tab label="Counter Reset">
        <div class="card-tab-content">
            
            <p>
                <button mat-button (click)="addNewResetCounterPhrase(resetCounterTargetsTable)" color="accent" style="float: right; margin: 5px;"><mat-icon>add</mat-icon>New</button>
                <span style="font-size: 12px; font-weight: 400; line-height: 10px;">If any of the below phrases match a new log entry, the counter will be reset.</span>
            </p>
        
        <table mat-table #resetCounterTargetsTable="matTable"
            [dataSource]="action.resetCounterPhrases"
            class="capture-phrases">

            <ng-container matColumnDef="phrase">
                <th mat-header-cell *matHeaderCellDef> Phrase </th>
                <td mat-cell *matCellDef="let element; let i = index">
                    <mat-form-field style="width: 100%;">
                        <mat-label>Capture Phrase</mat-label>
                        <input matInput name="txtResetCounterPhrase" type="text" [(ngModel)]="element.phrase" />
                    </mat-form-field>
                </td>
            </ng-container>

            <ng-container matColumnDef="regEx">
                <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 50px;"> RegEx </th>
                <td mat-cell *matCellDef="let element; let i = index"> <div style="text-align: center; padding: 20px;"><mat-checkbox name="cbxResetCounterUseRegEx" [(ngModel)]="element.useRegEx"></mat-checkbox></div> </td>
            </ng-container>

            <ng-container matColumnDef="delete">
                <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 50px;">  </th>
                <td mat-cell *matCellDef="let element; let ei = index">
                    <button mat-icon-button color="warn" aria-label="Delete this capture phrase" (click)="deleteResetCounterPhrase(ei, resetCounterTargetsTable)">
                        <mat-icon>clear</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="phraseTableColumns"></tr>
            <tr mat-row *matRowDef="let element; columns: phraseTableColumns;"></tr>

        </table>

        </div>
    </mat-tab>
</mat-tab-group>
