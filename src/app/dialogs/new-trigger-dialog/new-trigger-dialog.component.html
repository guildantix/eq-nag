<h2 mat-dialog-title>Confirm</h2>

<mat-dialog-content>

    <p>
        <mat-form-field style="width: 50%;">
            <mat-label>Character Class</mat-label>
            <mat-select [(ngModel)]="characterClass" name="ddlCharacterClass">
                <mat-option value="BRD">Bard</mat-option>
                <mat-option value="BST">Beastlord</mat-option>
                <mat-option value="BER">Berserker</mat-option>
                <mat-option value="CLR">Cleric</mat-option>
                <mat-option value="DRU">Druid</mat-option>
                <mat-option value="ENC">Enchanter</mat-option>
                <mat-option value="MAG">Magician</mat-option>
                <mat-option value="MNK">Monk</mat-option>
                <mat-option value="NEC">Necromancer</mat-option>
                <mat-option value="PAL">Paladin</mat-option>
                <mat-option value="RNG">Ranger</mat-option>
                <mat-option value="ROG">Rogue</mat-option>
                <mat-option value="SHD">Shadowknight</mat-option>
                <mat-option value="SHA">Shaman</mat-option>
                <mat-option value="WAR">Warrior</mat-option>
                <mat-option value="WIZ">Wizard</mat-option>
            </mat-select>
        </mat-form-field>
        
        <mat-form-field style="width: 50%;">
            <mat-label>Overlay Window</mat-label>
            <mat-select [(ngModel)]="overlayId" name="ddlDotTimerOverlay">
                <mat-option *ngFor="let option of timerOverlays" [value]="option.overlayId">{{option.name}}</mat-option>
            </mat-select>
        </mat-form-field>
    </p>
    <p>
        <mat-form-field appearance="fill" style="width: 100%;">
            <mat-label>Allakhazam URL</mat-label>
            <input matInput type="text" [(ngModel)]="url" />
        </mat-form-field>
    </p>
</mat-dialog-content>

<mat-dialog-actions>

  <button mat-button mat-dialog-close class="t-confirm-no" color="warn">Cancel</button>
  <button mat-button (click)="scrape()" class="t-confirm-yes" color="accent">Import</button>

</mat-dialog-actions>
