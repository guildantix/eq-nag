<div class="modal">
    <header>
        <mat-toolbar class="titlebar" color="default">
            <span>New Trigger</span>
            <span class="spacer"></span>
            <button mat-icon-button aria-label="Exit application" (click)="closeModal()">
                <mat-icon>clear</mat-icon>
            </button>
        </mat-toolbar>
    </header>
    <section>
        <mat-tab-group animationDuration="0ms" (selectedIndexChange)="onChangeTabs($event)" [selectedIndex]="0">
            <mat-tab label="Capture">
                <div class="tab-content">

                    <fieldset class="margin-t-50">
                        <legend class="full-width">General</legend>
                        <mat-form-field>
                            <input matInput name="txtTriggerName" type="text" [(ngModel)]="model.name" placeholder="Trigger Name" />
                        </mat-form-field>
    
                        <mat-form-field>
                            <textarea matInput name="txtComments" [(ngModel)]="model.comments" placeholder="Comments" rows="5"></textarea>
                        </mat-form-field>
                    </fieldset>
                    <fieldset>
                        <legend class="full-width"><span>Phrases ({{model.capturePhrases?.length}})</span><span class="spacer"></span><button mat-button (click)="addNewCapturePhrase()" color="accent">New</button></legend>
                        <mat-form-field style="width: 200px;">
                            <mat-label>Capture Method</mat-label>
                            <mat-select [(ngModel)]="model.captureMethod">
                                <mat-option value="Any match">Any match</mat-option>
                                <mat-option value="Sequential" disabled>Sequential</mat-option>
                                <mat-option value="Concurrent" disabled>Concurrent</mat-option>
                            </mat-select>
                            <!-- <mat-hint>
                                <p><strong>Any match</strong> will execute this trigger if any phrase matches a log entry.</p>
                                <p><strong>Sequential</strong> will execute this trigger if all phrases match sequentially across multiple log entries.</p>
                                <p><strong>Concurrent</strong> will execute this trigger if all phrases match in a single log entry.</p>
                            </mat-hint> -->
                        </mat-form-field>
                        <table mat-table #capturePhrasesTable="matTable"
                            [dataSource]="model.capturePhrases"
                            class="capture-phrases">

                            <ng-container matColumnDef="number">
                                <th mat-header-cell *matHeaderCellDef style="width: 50px;"> No. </th>
                                <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
                            </ng-container>

                            <ng-container matColumnDef="phrase">
                                <th mat-header-cell *matHeaderCellDef> Phrase </th>
                                <td mat-cell *matCellDef="let element; let i = index">
                                    <mat-form-field>
                                        <mat-label>Capture Phrase</mat-label>
                                        <input matInput type="text" [(ngModel)]="element.phrase" />
                                    </mat-form-field>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="regEx">
                                <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 50px;"> RegEx </th>
                                <td mat-cell *matCellDef="let element; let i = index"> <div style="text-align: center; padding: 20px;"><mat-checkbox [(ngModel)]="element.useRegEx"></mat-checkbox></div> </td>
                            </ng-container>

                            <ng-container matColumnDef="delete">
                                <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 50px;">  </th>
                                <td mat-cell *matCellDef="let element; let i = index">
                                    <button mat-icon-button color="warn" aria-label="Delete this capture phrase" (click)="deleteCapturePhrase(i)">
                                        <mat-icon>clear</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="phraseTableColumns"></tr>
                            <tr mat-row *matRowDef="let element; columns: phraseTableColumns;"></tr>

                            <!-- <ng-container matColumnDef="{{column}}" *ngFor="let column of columnsToDisplay">
                                <th mat-header-cell *matHeaderCellDef> {{column}} </th>
                                <td mat-cell *matCellDef="let element"> {{element[column]}} </td>
                            </ng-container> -->
                            
                        </table>
                    </fieldset>

                                </mat-form-field>
                            </div>
                        </div>
                    </fieldset> -->

                </div>
            </mat-tab>

        </mat-tab-group>
    </section>
    <footer>
