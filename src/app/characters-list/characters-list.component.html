
<mat-accordion class="example-headers-align">
    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>Halivar</mat-panel-title>
        <mat-panel-description>Firiona Vie<mat-icon style="margin-left:15px;" color="accent">cast_connected</mat-icon></mat-panel-description>
      </mat-expansion-panel-header>

      <mat-tab-group animationDuration="0ms" [selectedIndex]="0">
        <mat-tab label="Settings">
            <div style="padding: 15px;display: flex;flex-direction: column;justify-content: center;flex: 1 1 0px;">

                <mat-card style="background-color: #272727; margin: 7px;">
                    <mat-card-header>
                        <mat-card-title>
                            Log file
                        </mat-card-title>
                    </mat-card-header>
                    <mat-card-content>
                        characters: {{characters.length}}
                        <button mat-button color="accent">Select Log File</button>
                        <div><small>Current: asdfasdfasdfasdfasddf</small></div>
                    </mat-card-content>
                </mat-card>
                
                <mat-card style="background-color: #272727; margin: 7px;">

                    <mat-card-header>
                        <mat-card-title>Focus Effects</mat-card-title>
                    </mat-card-header>

                    <mat-card-content>
                        <mat-checkbox> Extended DOT Focus?</mat-checkbox>
                        <!-- *ngIf="focusEffectSettings.hasExtendedDotFocus" -->
                        <span >

                            <mat-form-field style="width: 104px; margin-left: 15px;">
                                <mat-label>%</mat-label>
                                <input matInput name="txtExtDotFocusPercent" type="number" />
                                <mat-hint>Percent increase</mat-hint>
                            </mat-form-field>
                            
                            <mat-form-field style="width: 192px; margin-left: 15px;">
                                <mat-label>Level</mat-label>
                                <input matInput name="txtExtDotFocusDecayLevel" type="number" />
                                <mat-hint>Level at which decay begins</mat-hint>
                            </mat-form-field>

                        </span>
                    </mat-card-content>
                </mat-card>

            </div>
        </mat-tab>
        <mat-tab label="Triggers">

        </mat-tab>
      </mat-tab-group>
