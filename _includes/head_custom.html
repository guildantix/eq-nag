<script>
  ( function () {
    try {
      var saved = localStorage.getItem( 'nag-theme' );
      if ( saved === 'nag-light' || saved === 'nag-dark' ) {
        document.documentElement.setAttribute( 'data-nag-theme', saved );
        if ( saved !== 'nag-dark' ) {
          jtd.setTheme( saved );
        }
      }
    } catch ( error ) {
    }
  } )();
</script>
<script>
  ( function () {
    var closed = {% if page.nav_collapsed %}true{% else %}false{% endif %};
    if ( !closed ) {
      try {
        closed = localStorage.getItem( 'nag-nav' ) === 'closed';
      } catch ( error ) {
      }
    }
    if ( closed ) {
      document.documentElement.classList.add( 'nag-nav-closed' );
    }
  } )();
</script>
